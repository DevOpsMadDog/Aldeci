$schema: "http://json-schema.org/draft-07/schema#"
title: "Scenario"
type: object
required:
  - id
  - stage
  - description
  - inputs
  - commands
properties:
  id:
    type: string
    pattern: '^[a-z0-9_\-]+$'
  stage:
    type: string
    enum: [design, build, test, deploy, operate]
  description:
    type: string
  tags:
    type: array
    items:
      type: string
  inputs:
    type: object
    additionalProperties:
      type: object
      properties:
        source:
          type: string
          description: "Path to the input artifact relative to repository root or FixOps sample name"
        format:
          type: string
        metadata:
          type: object
      required: [source]
  commands:
    type: array
    minItems: 1
    items:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: "CLI command name (without aldecI prefix)"
        args:
          type: array
          items:
            type: string
        backend_override:
          type: string
          enum: [local, http]
        expect_gap:
          type: boolean
  expected:
    type: object
    properties:
      exit_code:
        type: integer
      outputs:
        type: object
      notes:
        type: string
  invariants:
    type: array
    items:
      type: string
      description: "Named invariant identifiers enforced by tools/e2e/invariants.py"
  skip_if_gap:
    type: array
    items:
      type: string
additionalProperties: false
