[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aldecI"
version = "0.1.0"
description = "AlDeci platform bootstrap"
authors = [
  { name = "AlDeci Maintainers" }
]
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "pydantic",
  "networkx==3.4.2",
  "numpy",
  "rich",
  "pytest",
  "radon",
  "requests",
  "structlog",
  "cryptography",
  "PyYAML",
  "typer",
  "lib4sbom"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "apps*",
  "services*",
  "infra*",
  "telemetry*",
  "sdk*",
  "cli*",
  "domain*"
]
exclude = [
  "artifacts*",
  "samples*",
  "tests*",
  "docs*",
  "scripts*",
  "config*"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "radon"
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
