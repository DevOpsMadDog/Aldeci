id: deploy_0065
stage: deploy
description: 'Deploy scenario #65 covering version-lag topology'
tags:
- stage:deploy
- topology:version-lag
- version_lag:1
inputs:
  sbom:
    source: samples/fixops_import/example.sbom.json
    format: sbom
commands:
- name: ingest sbom
  args:
  - --in
  - samples/fixops_import/example.sbom.json
  - --out
  - artifacts/e2e/deploy_0065/normalized_sbom.json
- name: risk score
  args:
  - --sbom
  - artifacts/e2e/deploy_0065/normalized_sbom.json
  - --epss
  - samples/fixops_import/example.epss.csv
  - --kev
  - samples/fixops_import/example.kev.json
  - --out
  - artifacts/e2e/deploy_0065/risk.json
- name: gate
  args:
  - --policy
  - samples/fixops_import/example.policy.json
  - --risk-report
  - artifacts/e2e/deploy_0065/risk.json
  - --provenance-dir
  - samples/fixops_import/provenance
  - --repro-attestation
  - samples/fixops_import/example.repro_attestation.json
expected:
  exit_code: 0
invariants:
- kev_policy
- idempotence
skip_if_gap: []
