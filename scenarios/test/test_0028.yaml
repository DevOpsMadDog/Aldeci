id: test_0028
stage: test
description: 'Test scenario #28 covering version-lag topology'
tags:
- stage:test
- topology:version-lag
- version_lag:-3
inputs:
  sbom:
    source: samples/fixops_import/example.sbom.json
    format: sbom
commands:
- name: ingest sbom
  args:
  - --in
  - samples/fixops_import/example.sbom.json
  - --out
  - artifacts/e2e/test_0028/normalized_sbom.json
- name: risk score
  args:
  - --sbom
  - artifacts/e2e/test_0028/normalized_sbom.json
  - --epss
  - samples/fixops_import/example.epss.csv
  - --kev
  - samples/fixops_import/example.kev.json
  - --out
  - artifacts/e2e/test_0028/risk.json
- name: gate
  args:
  - --policy
  - samples/fixops_import/example.policy.json
  - --risk-report
  - artifacts/e2e/test_0028/risk.json
  - --provenance-dir
  - samples/fixops_import/provenance
  - --repro-attestation
  - samples/fixops_import/example.repro_attestation.json
expected:
  exit_code: 0
invariants:
- kev_policy
- idempotence
skip_if_gap: []
