id: test_0163
stage: test
description: 'Test scenario #163 covering diamond topology'
tags:
- epss:high
- stage:test
- topology:diamond
inputs:
  sbom:
    source: samples/fixops_import/example.sbom.json
    format: sbom
  sarif:
    source: samples/fixops_import/example.sarif.json
    format: sarif
commands:
- name: ingest sbom
  args:
  - --in
  - samples/fixops_import/example.sbom.json
  - --out
  - artifacts/e2e/test_0163/normalized_sbom.json
- name: risk score
  args:
  - --sbom
  - artifacts/e2e/test_0163/normalized_sbom.json
  - --epss
  - samples/fixops_import/example.epss.csv
  - --kev
  - samples/fixops_import/example.kev.json
  - --out
  - artifacts/e2e/test_0163/risk.json
- name: graph lineage
  args:
  - --artifact
  - test_0163-artifact
  - --normalized-sbom
  - artifacts/e2e/test_0163/normalized_sbom.json
  - --risk-report
  - artifacts/e2e/test_0163/risk.json
- name: evidence bundle
  args:
  - --release
  - test_0163
  - --normalized-sbom
  - artifacts/e2e/test_0163/normalized_sbom.json
  - --sbom-quality-json
  - samples/fixops_import/example.sbom_quality.json
  - --sbom-quality-html
  - samples/fixops_import/example.sbom_quality.html
  - --risk-report
  - artifacts/e2e/test_0163/risk.json
  - --repro-attestation
  - samples/fixops_import/example.repro_attestation.json
  - --provenance-dir
  - samples/fixops_import/provenance
  - --out
  - artifacts/e2e/test_0163/evidence.zip
- name: gate
  args:
  - --policy
  - samples/fixops_import/example.policy.json
  - --risk-report
  - artifacts/e2e/test_0163/risk.json
  - --provenance-dir
  - samples/fixops_import/provenance
  - --repro-attestation
  - samples/fixops_import/example.repro_attestation.json
expected:
  exit_code: 0
invariants:
- kev_policy
- epss_monotonic
- idempotence
- manifest_integrity
skip_if_gap: []
