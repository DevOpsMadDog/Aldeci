name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Build wheels (cached)
        run: |
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            python tools/env/dependency_doctor.py --wheelhouse-only
          else
            echo "Using cached wheels"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheels -r requirements-dev.txt
      - name: Lint (syntax check)
        run: python -m compileall cli apps services sdk tools

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Build wheels (cached)
        run: |
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            python tools/env/dependency_doctor.py --wheelhouse-only
          else
            echo "Using cached wheels"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheels -r requirements-dev.txt
      - name: Dependency integrity
        run: python -m pip check

  unit-tests:
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Build wheels (cached)
        run: |
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            python tools/env/dependency_doctor.py --wheelhouse-only
          else
            echo "Using cached wheels"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheels -r requirements-dev.txt
      - name: Run pytest
        run: pytest

  docs-check:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
      - name: Build wheels (cached)
        run: |
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            python tools/env/dependency_doctor.py --wheelhouse-only
          else
            echo "Using cached wheels"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheels -r requirements.txt
      - name: Regenerate docs
        run: python tools/docgen/api_cli_map.py
      - name: Check docs drift
        run: git diff --exit-code docs/API_CLI_MAP.md docs/INTERACTIONS.md docs/diagrams

  reuse-check:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
      - name: Build wheels (cached)
        run: |
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            python tools/env/dependency_doctor.py --wheelhouse-only
          else
            echo "Using cached wheels"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheels -r requirements.txt
      - run: python tools/reuse/enforce_reuse.py

  overlay-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
      - name: Build wheels (cached)
        run: |
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            python tools/env/dependency_doctor.py --wheelhouse-only
          else
            echo "Using cached wheels"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheels -r requirements-dev.txt
      - name: Overlay smoke tests
        run: pytest tests/overlay/test_overlay_smoke.py

  env-health:
    runs-on: ubuntu-latest
    needs: reuse-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
      - name: Build wheels (cached)
        run: |
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            python tools/env/dependency_doctor.py --wheelhouse-only
          else
            echo "Using cached wheels"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheels -r requirements.txt
      - name: Verify dependency doctor
        run: python tools/env/dependency_doctor.py --check

  scenario-catalog:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
      - name: Build wheels (cached)
        run: |
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            python tools/env/dependency_doctor.py --wheelhouse-only
          else
            echo "Using cached wheels"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheels -r requirements.txt
      - name: Validate scenario catalog
        run: python tools/scenario/validate.py

  e2e-matrix:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
      - name: Build wheels (cached)
        run: |
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            python tools/env/dependency_doctor.py --wheelhouse-only
          else
            echo "Using cached wheels"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheels -r requirements-dev.txt
      - name: Run matrix subset
        run: python tools/e2e/run_matrix.py --limit 200

  bug-gate:
    runs-on: ubuntu-latest
    needs: e2e-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore wheel cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: wheels-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
      - name: Build wheels (cached)
        run: |
          if ! ls wheels/*.whl >/dev/null 2>&1; then
            python tools/env/dependency_doctor.py --wheelhouse-only
          else
            echo "Using cached wheels"
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheels -r requirements-dev.txt
      - name: Run bug gate
        run: python tools/e2e/bug_gate.py --limit 200 --overlays demo enterprise --backends local http

